name: Inspect Domain

on:
  workflow_dispatch:
    inputs:
      domain:
        description: "Domain to inspect (e.g., example.com)"
        required: true
        type: string
      checks:
        description: "Comma-separated list of checks to run (leave empty for all)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build

      # Inputs are passed via env and validated rather than interpolated into
      # the script, so they can't inject shell commands.
      - name: Validate inputs
        id: validate
        env:
          DOMAIN: ${{ inputs.domain }}
          CHECKS: ${{ inputs.checks }}
        run: |
          if ! [[ "$DOMAIN" =~ ^[A-Za-z0-9.-]+$ ]]; then
            echo "::error::Invalid domain: must contain only letters, digits, dots, and hyphens"
            exit 1
          fi
          if [ -n "$CHECKS" ] && ! [[ "$CHECKS" =~ ^[a-z0-9,-]+$ ]]; then
            echo "::error::Invalid checks list"
            exit 1
          fi
          echo "domain=$DOMAIN" >> "$GITHUB_OUTPUT"

      - name: Inspect domain
        env:
          DOMAIN: ${{ inputs.domain }}
          CHECKS: ${{ inputs.checks }}
        run: |
          args=(--json)
          if [ -n "$CHECKS" ]; then
            args+=(--checks "$CHECKS")
          fi
          node dist/cli.js inspect "$DOMAIN" "${args[@]}" | tee result.json

      - name: Generate summary
        env:
          DOMAIN: ${{ inputs.domain }}
        run: |
          {
            echo "## 🔍 Inspection: \`$DOMAIN\`"
            echo ""
            echo '```json'
            cat result.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload result
        uses: actions/upload-artifact@v7
        with:
          name: inspection-${{ steps.validate.outputs.domain }}
          path: result.json
          retention-days: 90
